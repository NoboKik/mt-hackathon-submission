    IntegrationUserResponse:
      type: object
      required: [id, employeeId, created]
      properties:
        id: { type: string, format: uuid, description: Внутренний id — тот же, что в выгрузке прогресса }
        employeeId: { type: string }
        created: { type: boolean, description: true — создан (201), false — обновлён (200) }
