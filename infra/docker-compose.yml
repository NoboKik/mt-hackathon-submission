# cd infra && docker compose up --build   (or from the repo root: docker compose -f infra/docker-compose.yml up --build)
# Every variable below comes from infra/.env — see infra/.env.example. With no .env at all the
# stack still runs locally on http://localhost with dev credentials and an open demo login.
# AUTH_SECRET empty: the web service refuses to sign sessions in production, but an empty value
# must not break `compose up -d postgres` for local development.
name: provodnik-400

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-provodnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provodnik}
      POSTGRES_DB: ${POSTGRES_DB:-provodnik}
    ports:
      - '127.0.0.1:5432:5432' # host-side pnpm db:migrate / db:seed; loopback only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-provodnik} -d ${POSTGRES_DB:-provodnik}']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot on every boot: migrations, then the seed — curated scenarios always; the demo people
  # only into an empty users table (SEED_IF_EMPTY), and never with SEED_DEMO=0.
  migrate:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: build # has drizzle-kit, tsx and the source; the runner has neither
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-provodnik}:${POSTGRES_PASSWORD:-provodnik}@postgres:5432/${POSTGRES_DB:-provodnik}
      SEED_IF_EMPTY: '1'
      SEED_DEMO: ${SEED_DEMO:-1}
    command: ['sh', '-c', 'pnpm db:migrate && pnpm db:seed']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-provodnik}:${POSTGRES_PASSWORD:-provodnik}@postgres:5432/${POSTGRES_DB:-provodnik}
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Auto mode's generator (any OpenAI-compatible endpoint). Empty: the app runs, /api/auto says so.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_DAILY_LIMIT: ${LLM_DAILY_LIMIT:-}
      # The demo login's invite code (/login?invite=…). Empty: the demo door is open.
      DEMO_INVITE: ${DEMO_INVITE:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Empty would reach Caddy as a blank site address (its own default only covers unset).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
